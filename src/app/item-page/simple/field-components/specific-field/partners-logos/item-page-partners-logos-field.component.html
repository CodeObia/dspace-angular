@if (item?.allMetadata(fields).length) {
  <div class="item-page-field">
    <div class="simple-view-element">
      @if (label) {
        <h2 class="simple-view-element-header">{{ label | translate }}</h2>
      }
      <div class="simple-view-element-body">
        <div class="d-flex flex-wrap justify-content-start gap-2 partners-list">
          @for (logo of partnersLogos; track logo) {
            <img [src]="logo">
          }
        </div>
      </div>
    </div>
  </div>
}
